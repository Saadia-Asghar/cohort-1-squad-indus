# Free-tier keep-warm: ping production so Vercel Hobby + Neon do not sit idle.
# GitHub may delay schedules by a few minutes; that is still enough to avoid long cold starts.
name: Keep API warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake API and database
        run: curl -fsS --max-time 25 "https://cohort-1-squad-indus-api-server-z3b.vercel.app/api/healthz"
